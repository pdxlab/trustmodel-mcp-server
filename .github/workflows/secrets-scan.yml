name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The binary that gates every merge is checked against a pinned sha256 before it
      # runs (from gitleaks_8.21.2_checksums.txt, and re-hashed on 12 Nov 2026).
      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan latest push
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --log-opts="-1 HEAD"
