name: verify-scanner

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to the package floor. The guarded launcher and install check
      # enforce the same version for consumers (TRUS-1415).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: npm ci

      - name: Build + run scanner acceptance script
        run: npm run verify:scanner
